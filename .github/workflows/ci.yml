name: ci
# The umbrella part of the monorepo: launcher, GUI, installer. Changes inside tool
# directories are run by their own workflows (ci-<tool>.yml with a paths filter) — they are
# ignored here so macOS minutes are not burned on every tool commit.
on:
  push:
    paths-ignore:
      - 'securetrash/**'
      - 'vaultwatch/**'
      - 'panic/**'
      - 'ghostdraft/**'
      - 'seedsplit/**'
  pull_request:
    paths-ignore:
      - 'securetrash/**'
      - 'vaultwatch/**'
      - 'panic/**'
      - 'ghostdraft/**'
      - 'seedsplit/**'
jobs:
  launcher:
    # The macOS/Linux launcher `paranoid` is pure Bash: shellcheck + bats (tools are stubbed on PATH).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Lint
        run: shellcheck paranoid install.sh
      - name: Unit tests
        run: bats test/

  macos-gui:
    # The native menu-bar agent gui/macos/ParanoidBar.swift (Swift/AppKit, Phase B). Runs the
    # gate gui/README.md names — test.sh = build.sh + `--selftest` — not build.sh alone: the
    # compiler cannot see a regression in the shell-quoting, locale or notification-decision
    # logic, and those are pure functions the selftest covers. Safe on a headless runner:
    # runSelfTests() exits before NSApplication is ever touched. No packaging or signing here
    # (that needs the Apple Developer account and a machine-bound key).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build + selftest the menu-bar agent
        run: bash gui/macos/test.sh

  windows:
    # The Windows mirror `windows/paranoid.ps1` (PowerShell, BETA): Pester checks the orchestration
    # (dashboard text, dispatch into the right CLI, panic greying/confirm) with mocked tools.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.9.1
      - name: Pester (paranoid.ps1 launcher + GUI tray)
        shell: pwsh
        run: |
          # The launcher mirror + the system-tray agent logic (Phase B). The tray tests dot-source the
          # script under ST_NO_MAIN=1 → the WinForms loop does not start; pure menu/autostart logic is checked.
          $r = Invoke-Pester @('windows/test', 'gui/windows/test') -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }

  # Windows PowerShell 5.1 — the shell a user gets by default, and the one that broke:
  # it decodes a BOM-less .ps1 in the system ANSI codepage, so Cyrillic string literals
  # turned to mojibake and the script died with a ParserError before running. The pwsh 7
  # job above cannot see that class of defect at all, because pwsh reads UTF-8 by default.
  # `shell: powershell` is Windows PowerShell 5.1 on the runner.
  windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with the 5.1 parser
        shell: powershell
        run: |
          $bad = @()
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1 -File)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad += "$($f.FullName): $($errors[0].Message)"
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) file(s) do not parse under Windows PowerShell 5.1" }
      - name: Install Pester 5
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.9.1
      - name: Pester under Windows PowerShell 5.1
        shell: powershell
        run: |
          # The `powershell` shell template sets $ErrorActionPreference = 'stop', and 5.1
          # turns a child process's stderr into an ErrorRecord when a test merges 2>&1 —
          # so a fail-closed test reading the installer's honest stderr would blow up on
          # the harness rather than on the assertion. The tests check exit codes explicitly.
          $ErrorActionPreference = 'Continue'
          $r = Invoke-Pester @('windows/test', 'gui/windows/test') -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
      - name: Smoke — the launcher actually answers under 5.1
        shell: powershell
        run: |
          .\windows\paranoid.ps1 version
          .\windows\paranoid.ps1 --help
