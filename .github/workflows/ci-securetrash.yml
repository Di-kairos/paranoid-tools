name: ci-securetrash
# Monorepo: runs only on changes inside securetrash/ (paths filter).
# Moved from the securetrash repo during the migration; all run steps work from the tool directory.
on:
  push:
    paths: ['securetrash/**', '.github/workflows/ci-securetrash.yml']
  pull_request:
    paths: ['securetrash/**', '.github/workflows/ci-securetrash.yml']
  # Manual run: the release gate wants a green run at the exact tagged commit. A tag
  # push does trigger this workflow, but only when the tagged commit's own diff matches
  # the paths filter above — tag a commit that touched nothing here (a .github/-only
  # fix, say) and no run appears. Dispatch it on that commit by hand instead.
  workflow_dispatch:
defaults:
  run:
    working-directory: securetrash
jobs:
  # Free Linux job: lint on every push (no macOS minutes spent).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck securetrash install.sh lib/common.sh

  # macOS job: the bats tests depend on require_macos/hdiutil/shasum, plus a real
  # vault smoke. Requires a valid payment method (paid macOS runners).
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install bats-core shellcheck
      - name: Unit tests
        run: bats test/
      - name: Vault smoke test (real hdiutil)
        run: |
          export ST_VAULT_PASS=ci-test-pass ST_ASSUME_YES=1
          ./securetrash vault create 10m
          ./securetrash vault open
          echo secret > /Volumes/SecretVault/s.txt
          ./securetrash vault close
          ./securetrash vault destroy
          test ! -e "$HOME/SecureVault.sparsebundle"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.9.1
      - name: Pester (logic tests, mocked Windows cmdlets)
        shell: pwsh
        run: |
          $r = Invoke-Pester windows/test -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }

  # Windows PowerShell 5.1 — the shell a user gets by default, and the one that broke:
  # it decodes a BOM-less .ps1 in the system ANSI codepage, so Cyrillic string literals
  # turned to mojibake and the script died with a ParserError before running. The pwsh 7
  # job above cannot see that class of defect at all, because pwsh reads UTF-8 by default.
  # `shell: powershell` is Windows PowerShell 5.1 on the runner.
  windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with the 5.1 parser
        shell: powershell
        run: |
          $bad = @()
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1 -File)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad += "$($f.FullName): $($errors[0].Message)"
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) file(s) do not parse under Windows PowerShell 5.1" }
      - name: Install Pester 5
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -RequiredVersion 5.9.1
      - name: Pester under Windows PowerShell 5.1
        shell: powershell
        run: |
          # The `powershell` shell template sets $ErrorActionPreference = 'stop', and 5.1
          # turns a child process's stderr into an ErrorRecord when a test merges 2>&1 —
          # so a fail-closed test reading the installer's honest stderr would blow up on
          # the harness rather than on the assertion. The tests check exit codes explicitly.
          $ErrorActionPreference = 'Continue'
          $r = Invoke-Pester windows/test -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
      - name: Smoke — the tool actually answers under 5.1
        shell: powershell
        run: |
          .\windows\securetrash.ps1 version
          .\windows\securetrash.ps1 --help
