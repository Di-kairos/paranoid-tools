name: release
# Monorepo releases: pushing a `<tool>-vX.Y.Z` tag runs the tool's tests, builds
# SHA256SUMS over its files, signs the manifest with the ecosystem's Ed25519 key
# and publishes a GitHub Release. Assets keep flat basenames (as the pre-migration
# per-tool releases did): a release is tag-scoped, so `install.sh`/`SHA256SUMS`
# of different tools never collide.
#
# Gates before anything is signed (only verified content gets a signature):
#   1. strict tag grammar `<tool>-vX.Y.Z` + the tag version must equal VERSION
#      inside the tool script;
#   2. every pinned default must be in lockstep with the tag: the tool's own
#      install.sh / windows/install.ps1 baked-in default, the umbrella
#      installer's version map, and the verify-releases.sh pin — otherwise a
#      freshly signed release would silently install or verify the previous
#      version;
#   3. installers must download from the monorepo, not the archived repos;
#   4. the tool's shellcheck + bats (+ vendor --check) at this exact commit.
#      The Windows matrix does not fit here time-wise — it runs in ci-<tool>.yml;
#      check that it is green before tagging.
#
# Requires the RELEASE_SIGNING_KEY secret (the same ed25519 key the five
# per-tool repos used; the pubkey is pinned in install.sh and SECURITY.md).
# Without the key the release ABORTS — unsigned releases do not exist.
on:
  push:
    tags:
      - 'securetrash-v*'
      - 'vaultwatch-v*'
      - 'panic-v*'
      - 'ghostdraft-v*'
      - 'seedsplit-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the tag and derive the tool name
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Strict grammar: <tool>-vX.Y.Z — no -rc suffixes, no empty versions.
          if [[ ! "$TAG" =~ ^(securetrash|vaultwatch|panic|ghostdraft|seedsplit)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Tag '$TAG' does not match <tool>-vX.Y.Z — refusing to release." >&2
            exit 1
          fi
          TOOL="${BASH_REMATCH[1]}"
          VER="${BASH_REMATCH[2]}"
          # The tag version must equal VERSION inside the tool script.
          script_ver="$(grep -Eo '^VERSION="?[0-9]+\.[0-9]+\.[0-9]+"?' "$TOOL/$TOOL" | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [[ "$script_ver" != "$VER" ]]; then
            echo "Tag version $VER != script VERSION $script_ver in $TOOL/$TOOL — bump the script first." >&2
            exit 1
          fi
          echo "TOOL=$TOOL" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Pinned defaults must be in lockstep with the tag
        run: |
          # A release whose installers or verifier still pin the previous version
          # would silently deliver stale artifacts. Every default names this tag.
          bad=0
          grep -Eq "^[A-Z]+_VERSION_DEFAULT=\"$VER\"$" "$TOOL/install.sh" \
            || { echo "$TOOL/install.sh: baked-in default is not $VER" >&2; bad=1; }
          grep -Eq "^\\\$[A-Z]+_VERSION_DEFAULT = '$VER'$" "$TOOL/windows/install.ps1" \
            || { echo "$TOOL/windows/install.ps1: baked-in default is not $VER" >&2; bad=1; }
          # The map is column-aligned, so the gap after `<tool>)` varies — match loosely.
          grep -Eq "^[[:space:]]*$TOOL\)[[:space:]]+echo \"${VER//./\\.}\" ;;\$" install.sh \
            || { echo "install.sh (umbrella): version map does not name $TOOL $VER" >&2; bad=1; }
          grep -Fq "$TOOL:$VER" verify-releases.sh \
            || { echo "verify-releases.sh: pin is not $TOOL:$VER" >&2; bad=1; }
          [ "$bad" -eq 0 ] || exit 1

      - name: Refuse to ship installers that still point at the archived repos
        run: |
          # A monorepo release must serve install.sh/ps1 that download FROM the
          # monorepo — otherwise a fresh signed release silently installs the old
          # binary from the archive. Flip checklist: docs/RELEASE-STATE.md.
          bad=0
          for f in "$TOOL/install.sh" "$TOOL/windows/install.ps1"; do
            if grep -qE "github\.com/Di-kairos/${TOOL}/releases" "$f"; then
              echo "$f still downloads from the archived Di-kairos/${TOOL} repo." >&2
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1

      - name: Test the tool at this exact commit (lint + bats + vendor check)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
          cd "$TOOL"
          shellcheck "$TOOL" install.sh
          [ -x tools/vendor-common.sh ] && ./tools/vendor-common.sh --check
          bats test/

      - name: Stage release assets (flat basenames)
        run: |
          mkdir -p dist
          cp "$TOOL/$TOOL" "$TOOL/install.sh" dist/
          cp "$TOOL/windows/$TOOL.ps1" "$TOOL/windows/install.ps1" dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: sha256sum "$TOOL" install.sh "$TOOL.ps1" install.ps1 > SHA256SUMS

      - name: Sign SHA256SUMS
        working-directory: dist
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          # The signature adds authenticity on top of integrity. The key is a
          # dedicated ed25519 one, passphrase-less (the protection is access to
          # GH Secrets); namespace 'file' as expected by ssh-keygen -Y verify.
          # No key → no release.
          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "RELEASE_SIGNING_KEY is not set — aborting the release (signing is mandatory)." >&2
            exit 1
          fi
          umask 077
          trap 'rm -f signing_key' EXIT
          printf '%s\n' "$SIGNING_KEY" > signing_key
          ssh-keygen -Y sign -f signing_key -n file SHA256SUMS
          echo "Signed SHA256SUMS → SHA256SUMS.sig"

      - name: Create GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            "dist/$TOOL" dist/install.sh "dist/$TOOL.ps1" dist/install.ps1 \
            dist/SHA256SUMS dist/SHA256SUMS.sig
