name: ci-vaultwatch
# Монорепо: гоняется только при изменениях внутри vaultwatch/ (paths-фильтр).
# Перенесён из vaultwatch-репо при миграции; все run-шаги работают из каталога тула.
on:
  push:
    paths: ['vaultwatch/**']
  pull_request:
    paths: ['vaultwatch/**']
defaults:
  run:
    working-directory: vaultwatch
jobs:
  test:
    # Linux-раннер: бесплатные минуты в GitHub Free. vaultwatch 3a — чистая
    # логика (shellcheck + vendor-check + bats), macOS/hdiutil пока не нужен.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Lint
        run: shellcheck vaultwatch tools/vendor-common.sh
      - name: Vendored common is in sync with pinned securetrash
        run: ./tools/vendor-common.sh --check
      - name: Unit tests
        run: bats test/

  windows:
    # Windows-порт (PowerShell, BETA): vaultwatch трогает Search/Task Scheduler/BitLocker/VSS,
    # поэтому Pester проверяет оркестровку (state, TTL-планирование, restore, hooks) с
    # замоканными системными примитивами.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
      - name: Pester (vaultwatch.ps1 orchestration + installer integrity gate)
        shell: pwsh
        run: |
          $r = Invoke-Pester windows/test -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }

  # Windows PowerShell 5.1 — the shell a user gets by default, and the one that broke:
  # it decodes a BOM-less .ps1 in the system ANSI codepage, so Cyrillic string literals
  # turned to mojibake and the script died with a ParserError before running. The pwsh 7
  # job above cannot see that class of defect at all, because pwsh reads UTF-8 by default.
  # `shell: powershell` is Windows PowerShell 5.1 on the runner.
  windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with the 5.1 parser
        shell: powershell
        run: |
          $bad = @()
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1 -File)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad += "$($f.FullName): $($errors[0].Message)"
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) file(s) do not parse under Windows PowerShell 5.1" }
      - name: Install Pester 5
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
      - name: Pester under Windows PowerShell 5.1
        shell: powershell
        run: |
          # The `powershell` shell template sets $ErrorActionPreference = 'stop', and 5.1
          # turns a child process's stderr into an ErrorRecord when a test merges 2>&1 —
          # so a fail-closed test reading the installer's honest stderr would blow up on
          # the harness rather than on the assertion. The tests check exit codes explicitly.
          $ErrorActionPreference = 'Continue'
          $r = Invoke-Pester windows/test -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
      # vaultwatch is the one tool that refuses 5.1 on purpose: TTL auto-dismount and the
      # vault hooks call pwsh.exe, so running here would promise a guard that never fires.
      # The refusal itself is the contract — assert it, and assert it names PowerShell 7.
      - name: Smoke — the 5.1 gate refuses honestly
        shell: powershell
        run: |
          # Child process, not dot-invocation: the refusal is written straight to the
          # process's stderr with [Console]::Error, which in-process redirection cannot catch.
          $ErrorActionPreference = 'Continue'
          $out = (& powershell.exe -NoProfile -File .\windows\vaultwatch.ps1 version 2>&1 | Out-String)
          if ($LASTEXITCODE -eq 0) { throw "vaultwatch must refuse to run under Windows PowerShell 5.1" }
          if ($out -notmatch 'PowerShell 7') { throw "the refusal must name PowerShell 7, got: $out" }
          Write-Host "refused as designed: $out"
          # The refusal leaves $LASTEXITCODE at 1 and the Actions shell template exits with it,
          # which would fail the step for the very behaviour this step asserts.
          exit 0
