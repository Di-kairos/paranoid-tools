name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Paranoid Tools stay small and dependency-free on purpose. Proposals that
        keep them honest and readable are most likely to land. Name the tool
        the request is about (or "ecosystem" if it spans several).
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The use case, not the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: deps
    attributes:
      label: Does this add a runtime dependency?
      description: The core is pure Bash / pure PowerShell with zero runtime deps.
      options:
        - "No"
        - "Yes (please justify above)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
