name: ci
on: [push, pull_request]
jobs:
  test:
    # Linux-раннер: бесплатные минуты. panic scaffold — чистая логика
    # (shellcheck + vendor-check + bats); macOS-примитивы стабятся в тестах.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Lint
        run: shellcheck panic tools/vendor-common.sh
      - name: Vendored common is in sync with pinned securetrash
        run: ./tools/vendor-common.sh --check
      - name: Unit tests
        run: bats test/

  windows:
    # Windows-порт (PowerShell, BETA): panic — сплошные side-effect'ы, поэтому Pester
    # проверяет оркестровку (lock/dismount/clear/--hard-гейт) с замоканными примитивами.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester 5
        shell: pwsh
        run: Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
      - name: Pester (panic.ps1 orchestration + installer integrity gate)
        shell: pwsh
        run: |
          $r = Invoke-Pester windows/test -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }

  # Windows PowerShell 5.1 — the shell a user gets by default, and the one that broke:
  # it decodes a BOM-less .ps1 in the system ANSI codepage, so Cyrillic string literals
  # turned to mojibake and the script died with a ParserError before running. The pwsh 7
  # job above cannot see that class of defect at all, because pwsh reads UTF-8 by default.
  # `shell: powershell` is Windows PowerShell 5.1 on the runner.
  windows-ps51:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1 with the 5.1 parser
        shell: powershell
        run: |
          $bad = @()
          foreach ($f in (Get-ChildItem -Recurse -Filter *.ps1 -File)) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $bad += "$($f.FullName): $($errors[0].Message)"
            }
          }
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host $_ }; throw "$($bad.Count) file(s) do not parse under Windows PowerShell 5.1" }
      - name: Install Pester 5
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
      - name: Pester under Windows PowerShell 5.1
        shell: powershell
        run: |
          # The `powershell` shell template sets $ErrorActionPreference = 'stop', and 5.1
          # turns a child process's stderr into an ErrorRecord when a test merges 2>&1 —
          # so a fail-closed test reading the installer's honest stderr would blow up on
          # the harness rather than on the assertion. The tests check exit codes explicitly.
          $ErrorActionPreference = 'Continue'
          $r = Invoke-Pester windows/test -Output Detailed -PassThru
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
      - name: Smoke — the tool actually answers under 5.1
        shell: powershell
        run: |
          .\windows\panic.ps1 version
          .\windows\panic.ps1 --help
